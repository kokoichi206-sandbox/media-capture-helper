name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: バージョンの上げ方
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

# 同時実行すると version bump のコミットが衝突するため直列化する
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # e2e は実機 Chrome とネットワークが必要で CI では検証できない(CLAUDE.md 参照)
      - run: pnpm compile
      - run: pnpm test

      # npm version が package.json 更新・コミット・タグ作成をまとめて行う
      - name: bump version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$BUMP" -m "release: v%s"

      # bump 後に zip することで manifest とファイル名に新バージョンが載る
      - run: pnpm zip

      # push は zip 成功後に行い、ビルド失敗時にタグだけ残る事態を避ける
      - name: push and create release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          git push --follow-tags origin "HEAD:${REF_NAME}"
          gh release create "v${VERSION}" .output/*.zip \
            --title "v${VERSION}" \
            --generate-notes

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>動画ダウンロード</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>動画ダウンロード</h1>
      <div id="status">動画情報を取得中...</div>
      <section id="video-info" hidden>
        <p id="video-title"></p>
        <label>
          画質
          <select id="quality-select"></select>
        </label>
        <p id="login-hint" class="hint" hidden>
          ログインすると、より高画質を選択できます。
        </p>
        <button id="download-button">ダウンロード</button>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

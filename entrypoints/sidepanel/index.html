<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>動画ダウンロード</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="app-header">
        <h1>動画ダウンロード</h1>
        <button id="theme-toggle" class="icon-button" type="button"></button>
      </header>

      <section id="new-download" class="card">
        <div id="status" class="status">動画情報を取得中...</div>
        <div id="video-info" hidden>
          <p id="video-title" class="video-title"></p>
          <label class="field">
            <span class="field-label">画質</span>
            <select id="quality-select"></select>
          </label>
          <p id="login-hint" class="hint" hidden>
            ログインすると、より高画質を選択できます。
          </p>
          <button id="download-button" class="button-primary" type="button">
            ダウンロード
          </button>
        </div>
      </section>

      <section id="downloads">
        <div class="section-head">
          <h2>ダウンロード</h2>
          <button id="clear-finished" class="link" type="button" hidden>
            完了を消す
          </button>
        </div>
        <p id="downloads-empty" class="empty">ダウンロードはまだありません。</p>
        <ul id="downloads-list"></ul>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
